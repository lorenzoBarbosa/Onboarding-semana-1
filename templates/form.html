<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        >
        <title>Formulário semana 1</title>
    </head>
    <script>
    const form = document.getElementById("form-cadastro");
    const mensagem = document.getElementById("mensagem");

    const estilos = {
        ok: "alert alert-success",
        aviso: "alert alert-warning",
        erro: "alert alert-danger",
    };

    form.addEventListener("submit", async (evento) => {
        evento.preventDefault();

        const dados = new FormData(form);

        try {
            const resposta = await fetch("/cadastro", { method: "POST", body: dados });
            const resultado = await resposta.json();

            mensagem.textContent = resultado.mensagem;
            mensagem.className = estilos[resultado.status] || estilos.erro;

            if (resposta.ok) {
                form.reset();
            }
        } catch (erro) {
            mensagem.textContent = "Erro de conexão com o servidor.";
            mensagem.className = estilos.erro;
        }
    });
    </script>
    <body>
        <div class="align-items-center d-flex justify-content-center" style="min-height: 100vh;">
            <form
                id="form-cadastro"
                class="border p-4 border rounded-3"
                action="/cadastro"
                method="post"
            >
                <div id="mensagem"></div>
                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input
                        type="email"
                        class="form-control"
                        name="email"
                        placeholder="Seu e-mail"
                        id="email"
                        required
                    >
                </div>
                <button type="submit" class="btn btn-primary">Enviar</button>
            </form>
        </div>
    </body>
</html>
