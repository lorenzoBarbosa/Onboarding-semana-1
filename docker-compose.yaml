services:
  n8n:
    image: n8nio/n8n
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=America/Sao_Paulo
    volumes:
      - n8n_data:/home/node/.n8n

  # Servidor de e-mail falso, só para testes locais
  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"   # caixa de entrada (navegador)
      - "1025:1025"   # SMTP

volumes:
  n8n_data: